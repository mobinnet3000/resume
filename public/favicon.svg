<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f78b1c"/>
      <stop offset="100%" stop-color="#f4ce23"/>
    </radialGradient>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(0.85); }
      }
      @keyframes ring {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      .dot { animation: pulse 1.5s ease-in-out infinite; transform-origin: center; }
      .ring { animation: ring 1.5s ease-in-out infinite; }
    </style>
  </defs>
  <circle class="ring" cx="16" cy="16" r="15" fill="none" stroke="#f78b1c" stroke-width="1"/>
  <circle class="dot" cx="16" cy="16" r="7" fill="url(#g)"/>
  <circle cx="16" cy="16" r="3" fill="#fff" opacity="0.3"/>
</svg>
